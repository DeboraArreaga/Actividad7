<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Registradora - Restaurante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h2>🍕 Pide tu Combo 🍔</h2>

        <form id="formularioRestaurante">
            <!-- 1. Plato Principal -->
            <div class="seccion">
                <label for="platoPrincipal">Elige tu plato principal:</label>
                <select id="platoPrincipal" required>
                    <option value="pizza">Pizza Familiar — $12.00</option>
                    <option value="hamburguesa">Hamburguesa con Queso — $7.50</option>
                    <!-- 🆕 NUEVO PLATO: Pollo Frito -->
                    <option value="pollo">Pollo Frito — $8.00</option>
                </select>
            </div>

            <!-- 2. Tamaño de Bebida -->
            <div class="seccion">
                <label>Tamaño de la Bebida:</label>
                <div class="opciones-inline">
                    <input type="radio" id="bebidaP" name="tamanoBebida" value="pequena" checked>
                    <label for="bebidaP" class="label-inline">Pequeña (+$1.00)</label>

                    <input type="radio" id="bebidaM" name="tamanoBebida" value="mediana">
                    <label for="bebidaM" class="label-inline">Mediana (+$1.50)</label>

                    <input type="radio" id="bebidaG" name="tamanoBebida" value="grande">
                    <label for="bebidaG" class="label-inline">Grande (+$2.00)</label>
                </div>
            </div>

            <!-- 3. Acompañamientos / Extras -->
            <div class="seccion">
                <label>¿Deseas agregar extras?</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="extraPapas" value="papas">
                        <label for="extraPapas" class="label-inline">Papas Fritas (+$2.50)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="extraHelado" value="helado">
                        <label for="extraHelado" class="label-inline">Helado de Vainilla (+$1.80)</label>
                    </div>
                    <!-- 🆕 NUEVO EXTRA: Pie de Queso -->
                    <div class="checkbox-item">
                        <input type="checkbox" id="extraPieQueso" value="pieQueso">
                        <label for="extraPieQueso" class="label-inline">Pie de Queso (+$3.00)</label>
                    </div>
                </div>
            </div>

            <button type="submit">🧾 Calcular Cuenta</button>
        </form>

        <!-- Recibo -->
        <div id="reciboRespuesta"></div>

        <!-- PANEL DE ADMINISTRACIÓN -->
        <div class="panel-admin">
            <h3>📊 Administración de Ventas</h3>
            <div class="opciones-inline">
                <button type="button" id="btnVerHistorial" class="btn-azul">📋 Ver Historial</button>
                <button type="button" id="btnBorrarHistorial" class="btn-rojo">🗑️ Limpiar Base de Datos</button>
            </div>
            <div id="tablaHistorial"></div>
        </div>
    </div>

    <!-- Librería Dexie (IndexedDB) -->
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

    <!-- Archivo JavaScript -->
    <script src="javascript.js"></script>
</body>
</html>
